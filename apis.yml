aid: standard-bots
name: Standard Bots
description: >-
  Standard Bots designs and builds AI-native industrial robotic arms — the RO1
  family (Spark, Core/RO1, Thor, and the Bolt beta) — designed and assembled in the
  USA for machine tending, welding, palletizing, pick & place, and inspection. The
  robots ship with a developer platform, "StandardOS", that exposes a Bearer-token
  REST API served on the robot control box (/api/v1) for controlling arm motion,
  the gripper/end-effector, cameras, routines, teleoperation, recording, I/O and
  fault recovery. Alongside the REST API, Standard Bots publishes an official Python
  SDK (PyPI: standardbots), a realtime protobuf external-control streaming channel,
  and a ROS2 bridge (Cyclone DDS) with MoveIt and Modbus tooling — making the RO1
  programmable both for high-level orchestration and low-latency realtime control.
