apis:
- name: RO1 Robotics REST API
  description: >-
    On-robot REST API (served by the RO1 control box on /api/v1, Bearer-token auth)
    for controlling arm position and motion, the gripper/end-effector, cameras,
    routines, teleoperation, the recorder, I/O, calibration and fault recovery. A
    companion realtime protobuf stream and ROS2 bridge cover low-latency control.
  humanURL: https://docs.standardbots.com/docs/rest-api/
  baseURL: http://robot-control-box.local:3000
  x-base-url-note: >-
    The RO1 REST API is served on the robot control box on the local network
    (default port 3000), not a public internet host; the base URL is device-local
    and per-robot. Enable it in the Standard Bots app under Settings -> Configure
    Developer API.
  properties:
